        startCamera = { ...state.graphCamera };
        shell.setPointerCapture(event.pointerId);
        shell.classList.add("is-panning");
        shell.focus({ preventScroll: true });
        event.preventDefault();
      });
      shell.addEventListener("pointermove", (event) => {
        if (activePointer !== event.pointerId || !startCamera) return;
        state.graphCamera = {
          x: startCamera.x - (event.clientX - startX) / state.graphZoom,
          y: startCamera.y - (event.clientY - startY) / state.graphZoom
        };
        updateGraphCameraViewBox();
      });
      shell.addEventListener("pointerup", stopPanning);
      shell.addEventListener("pointercancel", stopPanning);
      shell.addEventListener("wheel", (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        const bounds = shell.getBoundingClientRect();
        const direction = event.deltaY < 0 ? 1 : -1;
        const nextZoom = state.graphZoom < 0.1
          ? state.graphZoom * (direction > 0 ? 2 : 0.5)
          : state.graphZoom + direction * 0.12;
        zoomGraphAtPointer(
          nextZoom,
          event.clientX - bounds.left,
          event.clientY - bounds.top
        );
      }, { passive: false });
      shell.addEventListener("dblclick", (event) => {
        if (!hasInteractiveTarget(event.target)) fitGraphToViewport();
      });
      shell.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        if (state.graphContextMenu) {
          state.graphContextMenu = null;
          render();
        }
      });
      shell.addEventListener("keydown", (event) => {
        const step = 96 / state.graphZoom;
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          adjustGraphZoom(1);
        } else if (event.key === "-") {
          event.preventDefault();
          adjustGraphZoom(-1);
        } else if (event.key === "0") {
          event.preventDefault();
          fitGraphToViewport();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          state.graphCamera.x -= step;
          render();
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          state.graphCamera.x += step;
          render();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          state.graphCamera.y -= step;
          render();
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          state.graphCamera.y += step;
          render();
        } else if (event.key === "Escape" && state.graphContextMenu) {
          event.preventDefault();
          state.graphContextMenu = null;
          render();
        }
      });
    }

    function graphNodePosition(node) {
      const match = /translate\(([-\d.]+)[ ,]([-\d.]+)\)/.exec(node.getAttribute("transform") || "");
      return match ? { x: Number(match[1]), y: Number(match[2]) } : { x: 0, y: 0 };
    }

    function graphEndpointPosition(nodeId, rowId) {
      const node = [...document.querySelectorAll("[data-graph-node-id]")]
        .find((element) => element.dataset.graphNodeId === nodeId);
      if (!node) return null;
      const row = [...node.querySelectorAll("[data-graph-row-id]")]
        .find((element) => element.dataset.graphRowId === rowId);
      if (!row) return null;
      const position = graphNodePosition(node);
      return {
        position,
        y: position.y + Number(row.dataset.rowCenterY)
      };
    }

    function refreshGraphEdgePaths() {
      const graph = document.querySelector(".graph");
      const nodeWidth = Number(graph?.dataset.nodeWidth || 220);
      document.querySelectorAll("[data-relationship-index]").forEach((edge) => {
        const source = graphEndpointPosition(edge.dataset.sourceNodeId, edge.dataset.sourceRowId);
        const target = graphEndpointPosition(edge.dataset.targetNodeId, edge.dataset.targetRowId);
        if (!source || !target) return;
        edge.setAttribute(
          "d",
          graphEdgePath(
            source.position,
            target.position,
            source.y,
            target.y,
            nodeWidth,
            edge.dataset.sourceNodeId === edge.dataset.targetNodeId
          )
        );
      });
    }

    function bindGraphNodeHandlers() {
      document.querySelectorAll("[data-graph-node-id]").forEach((node) => {
        let activePointer = null;
        let startX = 0;
        let startY = 0;
        let startPosition = null;
        let moved = false;
        const finishDrag = (event) => {
          if (activePointer !== event.pointerId) return;
          activePointer = null;
          node.classList.remove("dragging");
          if (node.hasPointerCapture(event.pointerId)) node.releasePointerCapture(event.pointerId);
          if (moved) {
            state.suppressObjectClickUntil = Date.now() + 250;
            render();
          }
        };

        node.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          activePointer = event.pointerId;
          startX = event.clientX;
          startY = event.clientY;
          startPosition = graphNodePosition(node);
          moved = false;
          node.setPointerCapture(event.pointerId);
          event.stopPropagation();
        });
        node.addEventListener("pointermove", (event) => {
          if (activePointer !== event.pointerId || !startPosition) return;
          const deltaX = event.clientX - startX;
          const deltaY = event.clientY - startY;
          if (!moved && Math.hypot(deltaX, deltaY) < 3) return;
          moved = true;
          const nextPosition = {
            x: startPosition.x + deltaX / state.graphZoom,
            y: startPosition.y + deltaY / state.graphZoom
          };
          state.graphNodePositions[node.dataset.graphNodeId] = nextPosition;
          node.setAttribute("transform", `translate(${nextPosition.x} ${nextPosition.y})`);
          node.classList.add("dragging");
          refreshGraphEdgePaths();
          event.preventDefault();
        });
        node.addEventListener("pointerup", finishDrag);
        node.addEventListener("pointercancel", finishDrag);
        node.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const objectTarget = event.target instanceof Element
            ? event.target.closest("[data-object-id]")
            : null;
          const objectId = objectTarget?.dataset.objectId || node.dataset.graphNodeId;
          const shell = document.querySelector("#graphShell");
          const bounds = shell?.getBoundingClientRect();
          if (!objectId || !bounds) return;
          state.selectedId = objectId;
          state.selectedRelationshipIndex = null;
          state.graphContextMenu = {
            objectId,
            x: event.clientX - bounds.left,
            y: event.clientY - bounds.top
          };
          render();
        });
      });
    }

    function fitGraphToViewport() {
      const bounds = state.graphLayout?.bounds;
      if (!bounds) return;
      const viewport = currentGraphViewport();
      const padding = 48;
      state.graphZoom = normalizeGraphZoom(Math.min(
        (viewport.width - padding * 2) / bounds.width,
        (viewport.height - padding * 2) / bounds.height
      ));
      state.graphCamera = {
        x: (bounds.minX + bounds.maxX) / 2 - viewport.width / state.graphZoom / 2,
        y: (bounds.minY + bounds.maxY) / 2 - viewport.height / state.graphZoom / 2
      };
      render();
    }

    function centerGraphObject(objectId) {
      const layout = state.graphLayout;
      const nodeId = layout?.objectToNodeId.get(objectId);
      const position = nodeId && layout.positions.get(nodeId);
      if (!layout || !position) return;
      const viewport = currentGraphViewport();
      const height = layout.nodeHeights.get(nodeId) || 52;
      state.graphCamera = {
        x: position.x + layout.nodeWidth / 2 - viewport.width / state.graphZoom / 2,
        y: position.y + height / 2 - viewport.height / state.graphZoom / 2
      };
      render();
    }

    function centerSelectedGraphNode() {
      if (state.selectedId) centerGraphObject(state.selectedId);
    }

    function navigateFromMinimap(event) {
      const bounds = event.currentTarget.getBoundingClientRect();
      const graphBounds = state.graphLayout?.bounds;
      if (!graphBounds) return;
      const horizontal = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));
      const vertical = Math.min(1, Math.max(0, (event.clientY - bounds.top) / bounds.height));
      const viewport = currentGraphViewport();
      state.graphCamera = {
        x: graphBounds.minX + horizontal * graphBounds.width - viewport.width / state.graphZoom / 2,
        y: graphBounds.minY + vertical * graphBounds.height - viewport.height / state.graphZoom / 2
      };
      render();
    }

    function runGraphContextAction(action) {
      const objectId = state.graphContextMenu?.objectId;
      if (!objectId) return;
      state.graphContextMenu = null;
      state.selectedId = objectId;
      state.selectedRelationshipIndex = null;
      if (action === "copy") {
        navigator.clipboard?.writeText(objectId).catch(() => undefined);
        render();
        return;
      }
      if (action === "connected") state.lineageScope = "connected";
      if (action === "upstream") state.lineageScope = "upstream";
      if (action === "downstream") state.lineageScope = "downstream";
      if (action !== "details") state.graphZoom = Math.max(0.7, state.graphZoom);
      render();
      if (action !== "details") requestAnimationFrame(() => centerGraphObject(objectId));
    }

    function selectObject(objectId) {
      if (!objectId || state.selectedId === objectId) return;
      const treeScroll = objectTree.scrollTop;
      const contentScroll = content.scrollTop;
      state.selectedId = objectId;
      state.graphContextMenu = null;
      render();
      objectTree.scrollTop = treeScroll;
      content.scrollTop = contentScroll;
    }

    function renderObjects(objects) {
      const rows = objects.filter(matches).map((item) => `
        <tr
          class="selectable-row${state.selectedId === item.id ? " selected" : ""}"
          data-object-id="${escapeHtml(item.id)}"
          tabindex="0"
        >
          <td><span class="badge">${escapeHtml(item.type)}</span></td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.id)}</td>
        </tr>
      `);
      renderTable(["Type", "Name", "ID"], rows);
    }

    function renderRelationships(objects, relationships) {
      const objectById = new Map(objects.map((item) => [item.id, item]));
      const rows = relationships
        .filter((item) => !state.relationshipType || item.type === state.relationshipType)
        .filter(matches)
        .map((item) => `
          <tr>
            <td><span class="badge ${escapeHtml(item.type)}">${escapeHtml(item.type)}</span></td>
            <td>${objectLink(item.source, objectById)}</td>
            <td>${objectLink(item.target, objectById)}</td>
            <td>${escapeHtml(item.expression)}</td>
          </tr>
        `);
      renderTable(["Type", "Source", "Target", "Expression"], rows);
    }

    function objectLink(objectId, objectById) {
      const object = objectById.get(objectId);
      const label = object?.name || objectId;
      return object
        ? `<button type="button" class="table-object" data-object-id="${escapeHtml(objectId)}">${escapeHtml(label)}</button>`
        : escapeHtml(label);
    }

    function renderDiagnostics(diagnostics) {
      const rows = diagnostics.filter(matches).map((item) => `
        <tr>
          <td><span class="badge ${escapeHtml(item.severity)}">${escapeHtml(item.severity)}</span></td>
          <td>${escapeHtml(item.code)}</td>
          <td>${escapeHtml(item.message)}</td>
          <td>${escapeHtml(item.spanText)}</td>
        </tr>
      `);
      renderTable(["Severity", "Code", "Message", "Span"], rows);
    }

    function renderTable(headers, rows) {
      if (!rows.length) {
        content.innerHTML = `<div class="empty">No rows match the current filters.</div>`;
        return;
      }
      content.innerHTML = `
        <div class="table-shell">
          <table>
            <thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>${rows.join("")}</tbody>
          </table>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    render();
  </script>
</body>
</html>
