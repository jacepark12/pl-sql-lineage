name: Lineage UI
on:
  pull_request:
    paths: ['web/**', 'plsql-lineage-engine/tests/fixtures/**', '.github/workflows/web.yml']
  push:
    paths: ['web/**', 'plsql-lineage-engine/tests/fixtures/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
