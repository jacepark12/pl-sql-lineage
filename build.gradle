plugins {
    id "application"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = "io.sqlflowmvp.Main"
}

tasks.register("verifyFixtures", JavaExec) {
    group = "verification"
    description = "Analyze all synthetic fixtures and verify expected objects, relationships, and diagnostics are present."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args "verify-fixtures", "--root", projectDir.absolutePath
}

tasks.register("verifyCorpus", JavaExec) {
    group = "verification"
    description = "Analyze pinned public and parser SQL corpora and verify coverage invariants."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args "verify-corpus", "--root", projectDir.absolutePath
}

check.dependsOn tasks.named("verifyFixtures"), tasks.named("verifyCorpus")
